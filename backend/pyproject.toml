[project]
name = "terratunes-backend"
version = "0.1.0"
description = "TerraTunes API: turns NASA Earth Information Center visualizations into sonification scores."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]>=0.115",
  "httpx>=0.27",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "numpy>=2.0",
  "pillow>=10.4",
  "av>=13.0",
  "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6", "mypy>=1.11", "types-PyYAML>=6.0"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]  # formatter handles line length; long user-facing strings are fine

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[[tool.mypy.overrides]]
# NumPy's arithmetic return types are imprecise for DSP code; keep strict elsewhere.
module = ["app.sonify.synth", "app.sonify.render"]
disable_error_code = ["no-any-return", "assignment"]
